<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rinde · Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{
  --sun-50:#FEF7E6;--sun-100:#FDE8B3;--sun-200:#FAD07A;--sun-300:#F5B942;--sun-400:#E8A93C;--sun-500:#C98A1F;--sun-600:#8E5F12;
  --sky-50:#EEF5FB;--sky-100:#D1E6F5;--sky-200:#A4CCE9;--sky-300:#77B2DD;--sky-400:#6AA3D9;--sky-500:#3D7DB3;--sky-600:#265E8E;
  --ink-900:#15181C;--ink-800:#1F2328;--ink-700:#2C3139;--ink-600:#3D4452;--ink-500:#5C6370;--ink-400:#7D8694;--ink-300:#A8B0BB;--ink-200:#CDD3DA;--ink-100:#ECEEF2;--ink-50:#F5F6F9;
  --paper:#FAFAF7;
  --neg:#D7263D;--neg-soft:#FCE9EC;--neg-ink:#8A1325;
  --pos:#1F8A5B;--pos-soft:#E4F4EC;--pos-ink:#0E5037;
  --warn:#C98A1F;--warn-soft:#FDF2D8;
  --shadow-sm:0 1px 2px rgba(20,24,30,.04),0 1px 1px rgba(20,24,30,.03);
  --shadow-md:0 6px 18px -8px rgba(20,24,30,.18),0 2px 6px rgba(20,24,30,.05);
  --shadow-lg:0 24px 48px -20px rgba(20,24,30,.25);
  --radius-sm:8px;--radius:12px;--radius-lg:16px;--radius-xl:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink-900);min-height:100vh;-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--paper)}
::-webkit-scrollbar-thumb{background:var(--ink-200);border-radius:5px;border:2px solid var(--paper)}

/* Layout */
.app{display:flex;min-height:100vh;max-width:1520px;margin:0 auto}
.sidebar{width:248px;min-width:248px;background:linear-gradient(180deg,#0F1418 0%,#151B22 100%);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.main{flex:1;min-width:0;padding:0 32px 56px;overflow-x:hidden}

/* Sidebar */
.sb-header{padding:22px 18px 18px;border-bottom:1px solid rgba(255,255,255,.06)}
.sb-logo{display:flex;align-items:center;gap:10px}
.sb-wordmark{font-size:20px;font-weight:800;letter-spacing:-.03em;line-height:1}
.sb-wordmark span:first-child{color:#6AA3D9}
.sb-wordmark span:last-child{color:#E8A93C}
.sb-nav{flex:1;padding:12px 0}
.sb-group{margin-bottom:2px}
.sb-group-label{padding:14px 18px 4px;font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#7d8694}
.sb-item{display:flex;align-items:center;gap:9px;padding:7px 16px;margin:1px 6px;border-radius:var(--radius-sm);cursor:pointer;transition:all .15s;color:#9BA3AE;font-size:13.5px;font-weight:500;position:relative;text-decoration:none}
.sb-item:hover{background:rgba(255,255,255,.05);color:#C8CDD5}
.sb-item.active{background:linear-gradient(90deg,rgba(232,169,60,.18),rgba(232,169,60,.04));color:#E8C87A;box-shadow:inset 2px 0 0 var(--sun-400)}
.sb-item.active svg{color:var(--sun-300)}
.sb-badge{margin-left:auto;font-size:10.5px;font-weight:700;padding:1.5px 6px;border-radius:10px;background:#E8A93C;color:#1A1000}
.sb-badge.new{background:#6AA3D9;color:#05233B}
.sb-footer{padding:14px 18px;border-top:1px solid rgba(255,255,255,.06);color:#4D5560;font-size:11px}
.sb-footer .mono{font-size:10.5px}

/* Topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 0 0;position:sticky;top:0;z-index:10;background:var(--paper)}
.breadcrumb{font-size:15px;font-weight:700;color:var(--ink-900)}
.topbar-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:36px;height:36px;border-radius:var(--radius-sm);border:1px solid var(--ink-100);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;color:var(--ink-500);position:relative}
.icon-btn:hover{border-color:var(--ink-200);box-shadow:var(--shadow-sm)}
.notif-dot{position:absolute;top:7px;right:7px;width:6px;height:6px;border-radius:50%;background:#D7263D;border:1.5px solid #fff}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#6AA3D9,#3D7DB3);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;cursor:pointer}

/* Greeting */
.greeting{padding:20px 0 0}
.greeting h1{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin-bottom:10px}
.greeting h1 .name{background:linear-gradient(90deg,var(--sun-400),var(--sun-500));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.greeting-sub{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.greeting-date{font-size:13.5px;color:var(--ink-500)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:12.5px;font-weight:500}
.pill-green{background:var(--pos-soft);color:var(--pos-ink)}
.pill-red{background:var(--neg-soft);color:var(--neg-ink)}
.pill-dark{background:linear-gradient(90deg,#0F1418,#1A2129);color:#C8CDD5}
.greeting-actions{display:flex;gap:10px;margin-top:14px;align-items:center}
.btn-month{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius-sm);border:1px solid var(--ink-200);background:#fff;font-size:13.5px;font-weight:500;color:var(--ink-700);cursor:pointer;transition:all .15s}
.btn-month:hover{border-color:var(--ink-300);box-shadow:var(--shadow-sm)}
.btn-cta{display:flex;align-items:center;gap:0;padding:0 16px 0 0;border-radius:var(--radius-sm);border:none;background:var(--ink-900);color:#fff;font-size:13.5px;font-weight:600;cursor:pointer;transition:all .15s;height:36px;overflow:hidden}
.btn-cta:hover{background:var(--ink-800);box-shadow:var(--shadow-md)}
.btn-cta-sq{width:36px;height:36px;background:var(--sun-400);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--ink-900);margin-right:10px;flex-shrink:0}

/* Content grid */
.content{padding:28px 0 0}
.grid12{display:grid;grid-template-columns:repeat(12,1fr);gap:20px}
.col8{grid-column:span 8}
.col4{grid-column:span 4}
.col7{grid-column:span 7}
.col5{grid-column:span 5}
.col12{grid-column:span 12}

/* Card base */
.card{background:#fff;border:1px solid var(--ink-100);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);overflow:hidden;transition:all .15s}
.card:hover{box-shadow:var(--shadow-md)}
.card-hd{padding:16px 20px 0}
.card-bd{padding:16px 20px 20px}
.card-title{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-500)}
.card-sub{font-size:12px;color:var(--ink-400);margin-top:2px}
.section-label{font-size:11px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-400);margin-bottom:14px}

/* Hero health */
.hero-card{background:linear-gradient(135deg,#0F1418 0%,#1A2129 100%);border:none;border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);overflow:visible;position:relative;margin-bottom:20px}
.hero-glow{position:absolute;top:-60px;right:-40px;width:280px;height:280px;background:radial-gradient(circle,rgba(232,169,60,.18) 0%,transparent 70%);pointer-events:none;border-radius:50%}
.hero-inner{display:grid;grid-template-columns:280px 1fr;gap:0;padding:28px 32px}
.hero-gauge-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.gauge-label{font-size:11px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:#7D8694;margin-bottom:4px}
.gauge-score{text-align:center;margin-top:-24px}
.gauge-num{font-size:46px;font-weight:800;color:#fff;font-family:'JetBrains Mono',monospace;line-height:1}
.gauge-denom{font-size:14px;color:#7D8694;margin-top:2px}
.gauge-grade{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--sun-400);margin-top:4px}
.hero-body{padding-left:32px;border-left:1px solid rgba(255,255,255,.08)}
.hero-title{font-size:18px;font-weight:700;color:#fff;margin-bottom:6px}
.hero-desc{font-size:13px;color:#7D8694;line-height:1.6;margin-bottom:20px}
.hero-desc b{color:#E4F4EC}
.hero-pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.pilar{background:rgba(255,255,255,.04);border-radius:var(--radius-sm);padding:12px}
.pilar-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.pilar-name{font-size:11px;color:#7D8694;font-weight:500}
.pilar-tag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px}
.pilar-tag.green{background:rgba(31,138,91,.25);color:#6EEAB4}
.pilar-tag.amber{background:rgba(201,138,31,.25);color:#F5C25A}
.pilar-val{font-size:14px;font-weight:700;color:#fff;font-family:'JetBrains Mono',monospace;margin-bottom:6px}
.pilar-bar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin-bottom:5px}
.pilar-bar-fill{height:100%;border-radius:3px;transition:width .3s}
.pilar-meta{font-size:11px;color:#5C6370}

/* KPI cards */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.kpi-card{background:#fff;border:1px solid var(--ink-100);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);overflow:hidden;transition:all .15s;cursor:default;position:relative}
.kpi-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.kpi-stripe{position:absolute;left:0;top:0;bottom:0;width:4px}
.kpi-inner{padding:16px 18px 14px}
.kpi-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.kpi-name{font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-500)}
.kpi-icon{width:32px;height:32px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center}
.kpi-amount{display:flex;align-items:baseline;gap:6px;margin-bottom:4px}
.kpi-num{font-size:28px;font-weight:700;font-family:'JetBrains Mono',monospace;line-height:1}
.kpi-currency{font-size:11px;font-weight:600;color:var(--ink-400);background:var(--ink-50);padding:2px 6px;border-radius:4px;align-self:center}
.kpi-sub{font-size:12px;color:var(--ink-400);margin-bottom:8px}
.kpi-delta{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:10px;margin-bottom:10px}
.kpi-delta.pos{background:var(--pos-soft);color:var(--pos-ink)}
.kpi-delta.neg{background:var(--neg-soft);color:var(--neg-ink)}
.kpi-delta.warn{background:var(--warn-soft);color:var(--warn)}
.kpi-delta.info{background:var(--sky-50);color:var(--sky-600)}
.kpi-meta{font-size:11.5px;color:var(--ink-400)}

/* Charts */
.chart-wrap{overflow-x:auto}
svg text{font-family:'JetBrains Mono',monospace}

/* Donut */
.donut-grid{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:start}
.cat-list{display:flex;flex-direction:column;gap:2px}
.cat-row{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:8px;padding:7px 8px;border-radius:var(--radius-sm);cursor:default;transition:background .12s}
.cat-row:hover{background:var(--ink-50)}
.cat-swatch{width:14px;height:14px;border-radius:3px}
.cat-name{font-size:13px;font-weight:500;color:var(--ink-800)}
.cat-trend{font-size:11px;margin-top:1px}
.cat-amount{text-align:right}
.cat-amt-val{font-size:13px;font-weight:600;font-family:'JetBrains Mono',monospace}
.cat-pct{font-size:11px;color:var(--ink-400)}

/* Quality rows */
.quality-row{margin-bottom:14px}
.quality-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.quality-swatch{width:12px;height:12px;border-radius:2px;margin-right:6px;display:inline-block}
.quality-name{font-size:13px;font-weight:600;color:var(--ink-800)}
.quality-val{font-size:14px;font-weight:700;font-family:'JetBrains Mono',monospace}
.quality-bar{height:10px;border-radius:5px;background:var(--ink-100);overflow:hidden;margin-bottom:5px}
.quality-fill{height:100%;border-radius:5px}
.quality-meta{font-size:11.5px;color:var(--ink-400)}
.card-footer-dashed{border-top:1px dashed var(--ink-100);padding:12px 20px;display:flex;align-items:flex-start;gap:9px;font-size:12px;color:var(--ink-500);line-height:1.5}

/* AI cards */
.insight-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.insight-card{background:#fff;border:1px solid var(--ink-100);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);overflow:hidden;transition:all .15s}
.insight-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.insight-hd{padding:16px 18px 12px;display:flex;align-items:flex-start;gap:12px}
.insight-icon{width:34px;height:34px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.insight-tag{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:10px;margin-bottom:4px;display:inline-block}
.insight-tag.opp{background:var(--pos-soft);color:var(--pos-ink)}
.insight-tag.warn{background:var(--warn-soft);color:var(--warn)}
.insight-tag.alert{background:var(--neg-soft);color:var(--neg-ink)}
.insight-title{font-size:15px;font-weight:700;color:var(--ink-900);line-height:1.3}
.insight-body{padding:0 18px 14px;font-size:13px;color:var(--ink-500);line-height:1.6}
.insight-body b{color:var(--ink-800)}
.insight-footer{padding:12px 18px;border-top:1px solid var(--ink-50);display:flex;gap:8px}
.btn-sm{font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:var(--radius-sm);cursor:pointer;transition:all .15s;border:none}
.btn-sm.primary{background:var(--ink-900);color:#fff}
.btn-sm.secondary{background:var(--ink-50);color:var(--ink-600);border:1px solid var(--ink-100)}
.btn-sm:hover{opacity:.85}

/* Goals */
.goal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.goal-card{background:linear-gradient(180deg,#FBFAF5,#fff);border:1px solid var(--ink-100);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow-sm);transition:all .15s}
.goal-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.goal-hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.goal-icon{width:28px;height:28px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center}
.goal-name{font-size:14px;font-weight:700;color:var(--ink-900);flex:1}
.goal-pct{font-size:15px;font-weight:700;font-family:'JetBrains Mono',monospace}
.goal-bar{height:8px;border-radius:4px;background:var(--ink-100);overflow:hidden;margin-bottom:10px}
.goal-fill{height:100%;border-radius:4px}
.goal-vals{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px}
.goal-cur{font-family:'JetBrains Mono',monospace;font-weight:600}
.goal-tot{color:var(--ink-400);font-family:'JetBrains Mono',monospace}
.goal-footer{display:flex;align-items:center;justify-content:space-between}
.goal-eta{font-size:12px;color:var(--ink-400)}
.goal-status{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px}
.goal-status.ok{background:var(--pos-soft);color:var(--pos-ink)}
.goal-status.behind{background:var(--warn-soft);color:var(--warn)}

/* Due dates */
.bills-list{display:flex;flex-direction:column;gap:2px}
.bill-row{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:12px;padding:10px 8px;border-radius:var(--radius-sm);transition:background .12s;cursor:default}
.bill-row:hover{background:var(--ink-50)}
.date-chip{width:48px;height:48px;border-radius:var(--radius-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.date-chip.normal{background:var(--ink-50);border:1px solid var(--ink-100)}
.date-chip.today{background:var(--sun-400);border:1px solid var(--sun-500)}
.date-chip.urgent{background:#FCE9EC;border:1px solid #F5B4BC}
.date-chip .day{font-size:18px;font-weight:800;font-family:'JetBrains Mono',monospace;line-height:1}
.date-chip.normal .day{color:var(--ink-700)}
.date-chip.today .day{color:var(--ink-900)}
.date-chip.urgent .day{color:var(--neg)}
.date-chip .mon{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.date-chip.normal .mon{color:var(--ink-400)}
.date-chip.today .mon{color:var(--ink-700)}
.date-chip.urgent .mon{color:var(--neg)}
.bill-name{font-size:13.5px;font-weight:600;color:var(--ink-800)}
.bill-meta{display:flex;align-items:center;gap:6px;margin-top:2px;font-size:11.5px;color:var(--ink-400)}
.bill-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.bill-tag{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:8px}
.bill-days{font-size:11.5px;color:var(--ink-500)}
.bill-amount{font-size:14px;font-weight:700;font-family:'JetBrains Mono',monospace;text-align:right}
.bill-amount.neg{color:var(--neg)}
.bill-amount.pos{color:var(--pos)}

/* Movements */
.mov-list{display:flex;flex-direction:column;gap:2px}
.mov-row{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:12px;padding:10px 8px;border-radius:var(--radius-sm);transition:background .12s;cursor:default}
.mov-row:hover{background:var(--ink-50)}
.mov-icon{width:34px;height:34px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mov-name{font-size:13.5px;font-weight:600;color:var(--ink-800)}
.mov-meta{font-size:11.5px;color:var(--ink-400);margin-top:2px}
.mov-amount{font-size:14px;font-weight:700;font-family:'JetBrains Mono',monospace;text-align:right;white-space:nowrap}
.mov-amount.neg{color:var(--neg)}
.mov-amount.pos{color:var(--pos)}

/* Tabs */
.tab-group{display:flex;background:var(--ink-50);border-radius:var(--radius-sm);padding:3px;gap:2px}
.tab-btn{padding:5px 12px;border-radius:6px;font-size:12.5px;font-weight:500;cursor:pointer;transition:all .12s;border:none;background:transparent;color:var(--ink-500)}
.tab-btn.active{background:#fff;color:var(--ink-900);box-shadow:var(--shadow-sm);font-weight:600}

/* Stack bar */
.stack-bar{height:36px;border-radius:var(--radius-sm);overflow:hidden;display:flex;margin-bottom:16px}
.stack-seg{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;transition:width .3s;overflow:hidden;white-space:nowrap}
.legend-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.legend-card{background:var(--ink-50);border-radius:var(--radius-sm);padding:10px 12px}
.legend-lbl{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-500);margin-bottom:4px}
.legend-val{font-size:16px;font-weight:700;font-family:'JetBrains Mono',monospace}
.legend-sub{font-size:11px;color:var(--ink-400);margin-top:2px}

/* Panel header */
.panel-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 14px}
.panel-hd-left{display:flex;flex-direction:column;gap:2px}
.panel-title{font-size:14px;font-weight:700;color:var(--ink-900)}
.panel-sub{font-size:12px;color:var(--ink-400)}
.panel-actions{display:flex;align-items:center;gap:10px}
.link-sm{font-size:12.5px;font-weight:500;color:var(--sky-500);cursor:pointer;text-decoration:none;transition:color .12s}
.link-sm:hover{color:var(--sky-600)}
.legend-row{display:flex;align-items:center;gap:14px}
.leg-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-500)}
.leg-dot{width:10px;height:10px;border-radius:50%}
.leg-dot.dashed{border:2px dashed var(--pos);background:transparent;border-radius:50%}

@media(max-width:1280px){
  .sidebar{width:200px;min-width:200px}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}

// ── Logo ───────────────────────────────────────────────────────────────────────
function Logo(){
  const rays=Array.from({length:16},(_,i)=>i*22.5);
  return(
    <svg width="32" height="32" viewBox="0 0 32 32">
      <defs>
        <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stopColor="#F5B942"/>
          <stop offset="100%" stopColor="#C98A1F"/>
        </radialGradient>
      </defs>
      {rays.map((a,i)=>{
        const rad=a*Math.PI/180;
        const x1=16+8*Math.cos(rad), y1=16+8*Math.sin(rad);
        const x2=16+13*Math.cos(rad), y2=16+13*Math.sin(rad);
        return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke="#E8A93C" strokeWidth="1.5" strokeLinecap="round"/>;
      })}
      <circle cx="16" cy="16" r="7" fill="url(#sunGrad)"/>
    </svg>
  );
}

// ── Sparkline ──────────────────────────────────────────────────────────────────
function Sparkline({data,color,height=36}){
  const w=200, h=height, pad=2;
  const min=Math.min(...data), max=Math.max(...data);
  const range=max-min||1;
  const pts=data.map((v,i)=>{
    const x=pad+(i/(data.length-1))*(w-pad*2);
    const y=h-pad-(v-min)/range*(h-pad*2);
    return `${x},${y}`;
  });
  const area=`M${pts[0]} L${pts.join(' L')} L${w-pad},${h} L${pad},${h} Z`;
  const line=`M${pts.join(' L')}`;
  return(
    <svg viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" style={{width:'100%',height:h}}>
      <defs>
        <linearGradient id={`sg-${color.replace('#','')}`} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.18"/>
          <stop offset="100%" stopColor={color} stopOpacity="0"/>
        </linearGradient>
      </defs>
      <path d={area} fill={`url(#sg-${color.replace('#','')})`}/>
      <path d={line} fill="none" stroke={color} strokeWidth="1.8" strokeLinejoin="round"/>
    </svg>
  );
}

// ── Gauge ──────────────────────────────────────────────────────────────────────
function Gauge({score}){
  const R=80, cx=100, cy=105;
  const startAngle=-Math.PI, endAngle=0;
  const pct=score/100;
  function polar(angle,r=R){
    return{x:cx+r*Math.cos(angle),y:cy+r*Math.sin(angle)};
  }
  function arc(r,sA,eA){
    const s=polar(sA,r), e=polar(eA,r);
    const large=eA-sA>Math.PI?1:0;
    return`M${s.x},${s.y} A${r},${r} 0 ${large} 1 ${e.x},${e.y}`;
  }
  const fillEnd=startAngle+pct*Math.PI;
  const dot=polar(fillEnd);
  return(
    <svg viewBox="0 0 200 120" style={{width:200,height:120}}>
      <defs>
        <linearGradient id="gaugeGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stopColor="#D7263D"/>
          <stop offset="40%" stopColor="#E8A93C"/>
          <stop offset="80%" stopColor="#1F8A5B"/>
        </linearGradient>
      </defs>
      <path d={arc(R,startAngle,endAngle)} fill="none" stroke="#2A323C" strokeWidth="14" strokeLinecap="round"/>
      {score>0&&<path d={arc(R,startAngle,fillEnd)} fill="none" stroke="url(#gaugeGrad)" strokeWidth="14" strokeLinecap="round"/>}
      {score>0&&<circle cx={dot.x} cy={dot.y} r="7" fill="#fff" stroke="#E8A93C" strokeWidth="2.5"/>}
    </svg>
  );
}

// ── Patrimony Chart ────────────────────────────────────────────────────────────
function PatrimonyChart(){
  const hist=[16400,17100,17650,18200,18800,19100,19700,20500,20900,21385];
  const proj=[21385,22100,22800,23600];
  const all=[...hist,...proj.slice(1)];
  const months=['ago','sep','oct','nov','dic','ene','feb','mar','abr','may','jun','jul','ago','dic'];
  const vw=760,vh=230,pL=50,pR=14,pT=14,pB=30;
  const chartW=vw-pL-pR, chartH=vh-pT-pB;
  const min=15000, max=25000;
  function xOf(i,total){return pL+(i/(total-1))*chartW;}
  function yOf(v){return pT+chartH-(v-min)/(max-min)*chartH;}
  const hPts=hist.map((v,i)=>`${xOf(i,all.length)},${yOf(v)}`);
  const allPts=all.map((v,i)=>`${xOf(i,all.length)},${yOf(v)}`);
  const histStart=xOf(0,all.length), histEnd=xOf(hist.length-1,all.length);
  const projStart=xOf(hist.length-1,all.length), projEnd=xOf(all.length-1,all.length);
  const areaPath=`M${hPts[0]} L${hPts.join(' L')} L${histEnd},${pT+chartH} L${histStart},${pT+chartH} Z`;
  const ticks=[15000,17500,20000,22500,25000];
  const curX=xOf(hist.length-1,all.length);
  const curY=yOf(hist[hist.length-1]);
  return(
    <svg viewBox={`0 0 ${vw} ${vh}`} style={{width:'100%',height:230}}>
      <defs>
        <linearGradient id="histArea" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#1F8A5B" stopOpacity="0.25"/>
          <stop offset="100%" stopColor="#1F8A5B" stopOpacity="0"/>
        </linearGradient>
      </defs>
      {ticks.map(t=>(
        <g key={t}>
          <line x1={pL} y1={yOf(t)} x2={vw-pR} y2={yOf(t)} stroke="#ECEEF2" strokeWidth="1"/>
          <text x={pL-6} y={yOf(t)+4} textAnchor="end" fontSize="10" fill="#A8B0BB">${Math.round(t/1000)}k</text>
        </g>
      ))}
      {months.slice(0,all.length).map((m,i)=>(
        <text key={i} x={xOf(i,all.length)} y={vh-4} textAnchor="middle" fontSize="9.5" fill="#A8B0BB">{m}</text>
      ))}
      <path d={areaPath} fill="url(#histArea)"/>
      <polyline points={hPts.join(' ')} fill="none" stroke="#1F8A5B" strokeWidth="2.4" strokeLinejoin="round"/>
      <polyline points={allPts.slice(hist.length-1).join(' ')} fill="none" stroke="#1F8A5B" strokeWidth="2.2" strokeLinejoin="round" strokeDasharray="5 5" opacity="0.75"/>
      <circle cx={curX} cy={curY} r="12" fill="#E8A93C" opacity="0.18"/>
      <circle cx={curX} cy={curY} r="6" fill="#E8A93C" stroke="#fff" strokeWidth="2"/>
    </svg>
  );
}

// ── Bar Chart ──────────────────────────────────────────────────────────────────
function BarChart(){
  const months=['May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const ingresos=[2840000,2840000,2840000,2840000,2840000,2840000,2840000,5680000];
  const egresos=[2208890,2100000,2050000,2180000,2200000,2250000,2100000,2300000];
  const vw=720,vh=220;
  const pL=50,pR=14,pT=14,pB=40;
  const chartW=vw-pL-pR, chartH=vh-pT-pB;
  const maxVal=Math.max(...ingresos,...egresos);
  const barW=18, gap=3;
  const colW=(chartW-barW*2*8-gap*8)/7;
  const ticks=[0,1000000,2000000,3000000,4000000,5000000,6000000];
  function xCol(i){return pL+i*(chartW/8);}
  function barH(v){return(v/maxVal)*chartH;}
  return(
    <svg viewBox={`0 0 ${vw} ${vh}`} style={{width:'100%',height:220}}>
      <defs>
        <linearGradient id="ingGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#3FB07C"/>
          <stop offset="100%" stopColor="#1F8A5B"/>
        </linearGradient>
        <linearGradient id="egGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#E64C5C"/>
          <stop offset="100%" stopColor="#D7263D"/>
        </linearGradient>
      </defs>
      {[0,25,50,75,100].map(pct=>{
        const y=pT+(1-pct/100)*chartH;
        return <line key={pct} x1={pL} y1={y} x2={vw-pR} y2={y} stroke="#F0F1F3" strokeWidth="1"/>;
      })}
      {months.map((m,i)=>{
        const cx=xCol(i)+chartW/16;
        const hI=barH(ingresos[i]);
        const hE=barH(egresos[i]);
        const isNow=i===0;
        const net=ingresos[i]-egresos[i];
        const netStr=net>=0?`+${(net/1000).toFixed(0)}k`:`-${(Math.abs(net)/1000).toFixed(0)}k`;
        return(
          <g key={m}>
            <rect x={cx-barW-gap/2} y={pT+chartH-hI} width={barW} height={hI}
              fill="url(#ingGrad)" rx="5" ry="5"
              stroke={isNow?'#E8A93C':'none'} strokeWidth={isNow?2:0}/>
            <rect x={cx+gap/2} y={pT+chartH-hE} width={barW} height={hE}
              fill="url(#egGrad)" rx="5" ry="5"
              stroke={isNow?'#E8A93C':'none'} strokeWidth={isNow?2:0}/>
            <text x={cx} y={vh-22} textAnchor="middle" fontSize="10" fill="#A8B0BB">{m}</text>
            <text x={cx} y={vh-8} textAnchor="middle" fontSize="9" fill={net>=0?'#1F8A5B':'#D7263D'} fontWeight="600">{netStr}</text>
          </g>
        );
      })}
    </svg>
  );
}

        <div className={`kpi-delta ${deltaDir}`}>{delta}</div>
        <div className="kpi-meta">{meta}</div>
      </div>
      {spark&&<Sparkline data={spark} color={sparkColors[tone]} height={36}/>}
    </div>
  );
}
